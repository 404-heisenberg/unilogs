name: Bug
description: Report a bug found during development or testing
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        A bug issue is auto-flagged with the `bug` label and, via the project
        automation, placed in the **Bugs** status/column on the board.

        Severity matters to Milestone 2, whose top band allows at most one
        **non-severe** bug:
        - **Severe** — blocks a key feature, corrupts data, or crashes.
        - **Minor** — cosmetic, low-impact, or a small edge case.

        > **After submitting, apply the matching severity label.** The dropdown
        > below only records your answer in the issue body, so the severity also
        > has to be put on the card:
        >
        > - chose **Severe** → apply the `severe` label
        > - chose **Minor** → apply the `minor` label
        >
        > A bug should always carry `bug` **and** one severity label. The label is
        > what stays visible on the card after the bug is closed, which is how
        > the tutor reviews what we found. The full process is in
        > [How we track bugs](https://github.com/404-heisenberg/unilogs/blob/main/docs/docs/bug-tracking.mdx).
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Minor
        - Severe
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong? A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot / recording
      description: Paste an image or link a screen recording showing the bug. If none, write N/A.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that produce the bug.
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened instead.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, device, and whether tested on the deployed site or locally.
      placeholder: 'e.g. Chrome on Windows 11, deployed on Vercel'
