services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unilogs_test
      POSTGRES_USER: unilogs_test
      POSTGRES_PASSWORD: unilogs_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U unilogs_test -d unilogs_test']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-test-data:/var/lib/postgresql/data

volumes:
  postgres-test-data:
